name: Pruebas CPU

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Comprobar compatibilidad
        run: python -m pip check
      - name: Ejecutar pruebas sin red ni modelo
        working-directory: 01_patrones_agenticos/tests
        run: python run_cpu.py
      - name: Ejecutar pruebas RAG sin red ni modelo
        working-directory: 02_rag/tests
        run: python run_cpu.py
      # Laboratorio 03 (rama del reto): el andamiaje debe estar en verde y las pruebas de aceptación
      # solo pueden estar en verde o PENDIENTES (TODO del reto). Con la solución, todo queda en verde.
      - name: Ejecutar pruebas del laboratorio de casos sin red ni modelo
        working-directory: 03_laboratorio/tests
        run: python run_cpu.py --ci
